<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Walk-in Wednesday</title>
<link rel="icon" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="description" content="Is it happening this week?">
<meta property="og:title" content="Walk-in Wednesday">
<meta property="og:description" content="Is it happening this week?">
<meta property="og:image" content="https://www.walkinwednesday.net/og-image.png">
<meta property="og:url" content="https://www.walkinwednesday.net">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<style>
  @font-face{font-family:'Clearly';src:url('Clearly-Regular.otf') format('opentype');font-display:swap}
  html,body{margin:0;background:#fff;color:#111;-webkit-font-smoothing:antialiased}
  main{min-height:80vh;min-height:80dvh;box-sizing:border-box;padding:clamp(28px,9vw,64px) clamp(32px,10vw,72px);font-family:'Clearly',Georgia,serif;display:flex;flex-direction:column;gap:clamp(36px,12vw,72px)}
  .date{font-size:clamp(26px,7.5vw,40px);line-height:1.1;max-width:4.5em;color:#1f7fbf}
  h1,.status{margin:0;font-weight:400;font-size:clamp(52px,16vw,112px);line-height:1.08}
  h1{max-width:6em}
  .love{margin:auto 0 0;font-size:20px;line-height:1.3;color:#111}
  .love a{color:#111;text-underline-offset:3px}
  .info,.info a{color:#1f7fbf}
  .on{color:#2f8f57} .off{color:#c41e1e}
</style>
</head>
<body>
<main>
  <div class="date" id="date"></div>
  <div>
    <h1>Walk-in Wednesday is:</h1>
    <div class="status" id="status"></div>
  </div>
  <p class="love">Love,<br>Joanna, Keith, Matilda &amp; Desi<br><br><span class="info">→ <a href="https://www.google.com/maps/search/?api=1&amp;query=211+W+30th+St+Richmond+VA+23225" target="_blank" rel="noopener">211 W. 30th</a><br>Pasta provided, BYOB.</span></p>
</main>
<script>
  // 👉 CHANGE THIS EACH WEEK: true = happening, false = not happening
  const IS_ON = true;

  const s = document.getElementById('status');
  s.className = 'status ' + (IS_ON ? 'on' : 'off');
  s.innerHTML = IS_ON ? 'HAPPENING' : 'NOT<br>HAPPENING';

  // Shows the date of the upcoming Wednesday (today, if it's Wednesday)
  const d = new Date(); d.setDate(d.getDate() + ((3 - d.getDay() + 7) % 7));
  const n = d.getDate();
  const suf = (n % 100 >= 11 && n % 100 <= 13) ? 'th' : ({1:'st',2:'nd',3:'rd'}[n % 10] || 'th');
  document.getElementById('date').textContent = d.toLocaleString('en-US', { month: 'long' }) + ' ' + n + suf;
</script>
</body>
</html>
