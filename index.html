<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Walk-in Wednesday</title>
<link rel="icon" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="description" content="Is it happening this week?">
<meta property="og:title" content="Walk-in Wednesday">
<meta property="og:description" content="Is it happening this week?">
<meta property="og:image" content="https://www.walkinwednesday.net/og-image.png">
<meta property="og:url" content="https://www.walkinwednesday.net">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<style>
  @font-face{font-family:'Payson';src:url('PaysonWF.otf') format('opentype');font-display:swap}
  html,body{margin:0;min-height:100%;color:#fff;-webkit-font-smoothing:antialiased}
  body.on{background:#237a47} body.off{background:#c41e1e}
  main{min-height:80vh;min-height:80dvh;box-sizing:border-box;padding:clamp(28px,9vw,64px) clamp(32px,10vw,72px) clamp(28px,9vw,64px) clamp(18px,5.5vw,48px);font-family:'Payson',Georgia,serif;display:flex;flex-direction:column;gap:clamp(36px,12vw,72px)}
  .date{font-size:clamp(18px,5.6vw,40px);line-height:1.1}
  h1,.status{margin:0;font-weight:400;font-size:clamp(44px,13.5vw,96px);line-height:1.08}
  h1{max-width:6em}
  .love{margin:clamp(13px,4vw,30px) 0 0;font-size:20px;line-height:1.3}
  a{color:#fff;text-underline-offset:3px}
  .pasta{display:flex;flex-wrap:wrap;align-items:center;gap:16px;margin-top:clamp(28px,8vw,48px)}
  .pasta button{all:unset;cursor:pointer;-webkit-tap-highlight-color:transparent;width:110px;max-width:100%;transition:width .45s cubic-bezier(.34,1.56,.64,1)}
  .pasta button:active{transform:scale(.96)}
  .pasta img{display:block;width:100%;height:auto}
  .oops{all:unset;cursor:pointer;display:none;margin-top:24px;font-size:15px;line-height:1.3;text-decoration:underline;text-underline-offset:3px;opacity:.85}
  .pasta p{margin:0;font-size:20px;line-height:1.3;max-width:11em}
</style>
</head>
<body>
<main>
  <div class="date" id="date"></div>
  <div>
    <h1>Walk-in Wednesday is:</h1>
    <div class="status" id="status"></div>
    <div class="pasta" id="pasta">
      <button id="bowl" aria-label="Tap the pasta to say you're coming"><img src="pasta.png" alt="Pasta"></button>
      <p>Tap the pasta if you’re coming.</p>
    </div>
  </div>
  <p class="love">→ <a href="https://www.google.com/maps/search/?api=1&amp;query=211+W+30th+St+Richmond+VA+23225" target="_blank" rel="noopener">211 W. 30th</a>, 5ish to 7ish.<br>Pasta provided, BYOB.<br><br>Love,<br>J, K, M &amp; D</p>
  <button class="oops" id="oops">Oops, I tapped the pasta but we’re actually not coming.</button>
</main>
<script>
  // 👉 CHANGE THIS EACH WEEK: true = happening (green), false = not happening (red)
  const IS_ON = true;

  document.body.className = IS_ON ? 'on' : 'off';
  document.querySelector('meta[name=theme-color]')?.remove();
  const tc = document.createElement('meta'); tc.name = 'theme-color'; tc.content = IS_ON ? '#237a47' : '#c41e1e';
  document.head.appendChild(tc);
  document.getElementById('status').innerHTML = IS_ON ? 'HAPPENING' : 'NOT<br>HAPPENING';

  // Pasta counter: the bowl grows 10% for every tap this week (shared by everyone)
  const pasta = document.getElementById('pasta'), bowl = document.getElementById('bowl'), oops = document.getElementById('oops');
  let count = 0;
  const size = () => bowl.style.width = (110 * (1 + 0.10 * count)) + 'px';

  // Remember how many times THIS phone tapped this week, so "Oops" can take them back
  const wk = new Date(); wk.setDate(wk.getDate() + ((3 - wk.getDay() + 7) % 7));
  const week = wk.toDateString();
  let mine = 0;
  try { const m = JSON.parse(localStorage.getItem('wiw-taps') || '{}'); if (m.week === week) mine = m.n || 0; } catch (e) {}
  const saveMine = () => { try { localStorage.setItem('wiw-taps', JSON.stringify({ week, n: mine })); } catch (e) {} oops.style.display = mine > 0 ? 'block' : 'none'; };

  if (!IS_ON) pasta.style.display = 'none';
  else {
    saveMine();
    fetch('/api/pasta').then(r => r.json()).then(d => { count = d.count || 0; size(); }).catch(() => {});
    bowl.addEventListener('click', () => {
      count++; mine++; size(); saveMine();
      fetch('/api/pasta', { method: 'POST' }).then(r => r.json()).then(d => { if (d.count >= count) { count = d.count; size(); } }).catch(() => {});
    });
    oops.addEventListener('click', () => {
      const n = mine; if (!n) return;
      count = Math.max(0, count - n); mine = 0; size(); saveMine();
      fetch('/api/pasta', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ undo: n }) })
        .then(r => r.json()).then(d => { if (typeof d.count === 'number') { count = d.count; size(); } }).catch(() => {});
    });
  }

  // Shows the date of the upcoming Wednesday (today, if it's Wednesday)
  const d = new Date(); d.setDate(d.getDate() + ((3 - d.getDay() + 7) % 7));
  const n = d.getDate();
  const suf = (n % 100 >= 11 && n % 100 <= 13) ? 'th' : ({1:'st',2:'nd',3:'rd'}[n % 10] || 'th');
  document.getElementById('date').textContent = d.toLocaleString('en-US', { month: 'long' }) + ' ' + n + suf;
</script>
</body>
</html>
