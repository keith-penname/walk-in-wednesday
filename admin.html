<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Walk-in Wednesday · Admin</title>
<link rel="icon" href="/favicon.png">
<link rel="apple-touch-icon" href="/admin-icon.png">
<meta name="apple-mobile-web-app-title" content="WIW Admin">
<style>
  @font-face{font-family:'Payson';src:url('PaysonWF.otf') format('opentype');font-display:swap}
  html,body{margin:0;background:#f4f1ea;color:#16140f;-webkit-font-smoothing:antialiased;font-family:Helvetica,Arial,sans-serif}
  .wrap{max-width:560px;margin:0 auto;padding:28px 18px 64px}
  h1{font-family:'Payson',Georgia,serif;font-weight:400;font-size:34px;line-height:1.05;margin:0 0 22px}
  .note{background:#16140f;color:#f4f1ea;font-size:13px;padding:10px 12px;border-radius:8px;margin-bottom:18px}
  .hero{border-radius:16px;color:#fff;padding:20px;display:grid;grid-template-columns:1fr auto;gap:4px 16px;align-items:end;margin-bottom:28px}
  .hero.on{background:#237a47}.hero.off{background:#c41e1e}
  .hero .lbl{font-size:13px;text-transform:uppercase;letter-spacing:.06em;opacity:.85}
  .hero .when{font-family:'Payson',Georgia,serif;font-size:30px;line-height:1.05}
  .hero .num{font-family:'Payson',Georgia,serif;font-size:72px;line-height:.9;text-align:right;grid-row:1 / span 2;grid-column:2}
  .hero .taps{grid-column:2;text-align:right;font-size:13px;text-transform:uppercase;letter-spacing:.06em;opacity:.85}
  h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#6b665c;font-weight:600;margin:28px 0 8px}
  .row{display:grid;grid-template-columns:1fr auto 76px;align-items:center;gap:12px;padding:12px 0;border-top:1px solid #dcd6c8;min-height:44px}
  .row:last-child{border-bottom:1px solid #dcd6c8}
  .row .dt{font-size:17px}
  .row .dt small{display:block;font-size:12px;color:#6b665c;margin-top:2px}
  .row .ct{font-variant-numeric:tabular-nums;font-size:15px;color:#3d3a33;text-align:right}
  .tog{all:unset;cursor:pointer;box-sizing:border-box;width:76px;height:36px;border-radius:999px;text-align:center;font-weight:700;font-size:13px;letter-spacing:.06em;color:#fff;-webkit-tap-highlight-color:transparent}
  .tog.on{background:#237a47}.tog.off{background:#c41e1e}
  .tog:disabled{cursor:default}
  .past .tog{background:transparent;color:#6b665c;border:1px solid #cfc8b8}
  .past .dt{color:#6b665c}
  .gate{display:flex;flex-direction:column;gap:12px;max-width:320px}
  .gate input{font:inherit;font-size:17px;padding:12px 14px;border:1px solid #cfc8b8;border-radius:10px;background:#fff}
  .gate button{all:unset;cursor:pointer;text-align:center;background:#16140f;color:#fff;padding:13px;border-radius:10px;font-weight:600}
  .err{color:#c41e1e;font-size:14px;min-height:1em}
  a{color:#16140f}a:hover{color:#6b665c}
</style>
</head>
<body>
<div class="wrap">
  <h1>Walk-in Wednesday</h1>
  <div id="app"></div>
</div>
<script>
  const app = document.getElementById('app');
  const LIVE = /walkinwednesday\.net$|vercel\.app$/.test(location.hostname);
  let pw = localStorage.getItem('wiw-admin') || '';
  let weeks = [], demo = false;

  const label = (ymd, opts) => { const [y, m, d] = ymd.split('-').map(Number); return new Date(y, m - 1, d).toLocaleDateString('en-US', opts); };
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  function gate(msg) {
    app.innerHTML = `<form class="gate" id="g"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" autofocus><div class="err">${esc(msg || '')}</div><button type="submit">Open</button></form>`;
    document.getElementById('g').onsubmit = e => { e.preventDefault(); pw = document.getElementById('pw').value; load(); };
  }
  const message = m => app.innerHTML = `<p class="err">${esc(m)}</p>`;

  async function load() {
    if (!LIVE) { demo = true; weeks = demoWeeks(); return render(); }
    if (!pw) return gate();
    app.innerHTML = '<p>Loading…</p>';
    const r = await fetch('/api/admin', { headers: { 'x-admin-password': pw }, cache: 'no-store' }).catch(() => null);
    if (!r) return message('Couldn’t reach the site. Check your connection.');
    if (r.status === 401) { localStorage.removeItem('wiw-admin'); pw = ''; return gate('Wrong password.'); }
    const j = await r.json().catch(() => ({}));
    if (!r.ok) return message(j.error || 'Something went wrong.');
    localStorage.setItem('wiw-admin', pw);
    weeks = j.weeks; render();
  }

  function row(w) {
    const past = w.offset < 0;
    const sub = w.offset === 0 ? 'This week' : w.offset === 1 ? 'Next week' : '';
    const ct = w.offset > 0 ? '' : `${w.count} ${w.count === 1 ? 'tap' : 'taps'}`;
    return `<div class="row ${past ? 'past' : ''}">
      <div class="dt">${label(w.date, { weekday: 'short', month: 'short', day: 'numeric' })}${sub ? `<small>${sub}</small>` : ''}</div>
      <div class="ct">${ct}</div>
      <button class="tog ${w.on ? 'on' : 'off'}" data-date="${w.date}" ${past ? 'disabled' : ''} aria-pressed="${w.on}">${w.on ? 'ON' : 'OFF'}</button>
    </div>`;
  }

  function render() {
    const cur = weeks.find(w => w.offset === 0);
    const upcoming = weeks.filter(w => w.offset >= 0);
    const past = weeks.filter(w => w.offset < 0).reverse();
    app.innerHTML = `
      ${demo ? '<div class="note">Demo data. On your live site this shows real counts and saves your changes.</div>' : ''}
      <div class="hero ${cur.on ? 'on' : 'off'}">
        <div class="lbl">This week · ${cur.on ? 'Happening' : 'Not happening'}</div>
        <div class="num">${cur.count}</div>
        <div class="when">${label(cur.date, { weekday: 'long', month: 'long', day: 'numeric' })}</div>
        <div class="taps">${cur.count === 1 ? 'pasta tap' : 'pasta taps'}</div>
      </div>
      <h2>Upcoming · tap to switch</h2>
      <div>${upcoming.map(row).join('')}</div>
      <h2>Past weeks</h2>
      <div>${past.map(row).join('')}</div>`;
    app.querySelectorAll('.tog:not(:disabled)').forEach(b => b.onclick = () => toggle(b.dataset.date));
  }

  async function toggle(date) {
    const w = weeks.find(x => x.date === date); w.on = !w.on; render();
    if (demo) return;
    const r = await fetch('/api/admin', { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-admin-password': pw }, body: JSON.stringify({ date, on: w.on }) }).catch(() => null);
    if (!r || !r.ok) { w.on = !w.on; render(); alert('Couldn’t save that change. Try again.'); }
  }

  function demoWeeks() {
    const out = [], counts = [9, 14, 0, 11, 7, 16, 12, 10, 6];
    for (let i = -8; i <= 16; i++) {
      const d = new Date(); d.setHours(12, 0, 0, 0); d.setDate(d.getDate() + ((3 - d.getDay() + 7) % 7) + i * 7);
      out.push({ date: d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(), offset: i, count: i <= 0 ? counts[i + 8] : 0, on: !(i === -6 || i === 6 || i === 7) });
    }
    return out;
  }

  load();
</script>
</body>
</html>
